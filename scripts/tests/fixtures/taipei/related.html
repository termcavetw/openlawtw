                                        <li>
                                            <div class="row">
                                                    <div class="col-no">&#x7B2C; 117 &#x689D;</div>

                                                <div class="col-data">
                                                        <div class="law-articlepre">違法行政處分於法定救濟期間經過後，原處分機關得依職權為全部或一部
之撤銷；其上級機關，亦得為之。但有下列各款情形之一者，不得撤銷︰
一、撤銷對公益有重大危害者。
二、受益人無第一百十九條所列信賴不值得保護之情形，而信賴授予利益
    之行政處分，其信賴利益顯然大於撤銷所欲維護之公益者。</div>
