name: Review weekly official snapshots
on:
  schedule:
    - cron: '23 20 * * 0' # Monday 04:23 Asia/Taipei; GitHub may delay jobs.
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: official-data-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENABLE_LAW_SYNC == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize fresh run reports before setup or downloads
        id: initialize
        run: python3 scripts/run-sync.py init
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: python scripts/run-sync.py step dependencies-node -- npm ci
      - name: Install Python dependencies
        run: python scripts/run-sync.py step dependencies-python -- python -m pip install -r requirements.txt
      - name: Install PDF text extraction dependency
        run: python scripts/run-sync.py step dependencies-system -- bash -c "sudo apt-get update && sudo apt-get install -y poppler-utils"
      - name: Run offline source and runner regression tests
        run: python scripts/run-sync.py step unit-tests -- python -m unittest discover -s scripts/tests -v
      - name: Keep a comparison baseline
        run: python scripts/run-sync.py step baseline -- bash -c "cp public/data/laws.json .sync-before.json && cp data/provenance.json .sync-before-provenance.json"
      - name: Fetch official law records
        run: python scripts/run-sync.py step laws -- python scripts/sync-laws.py --cache .law-cache --refresh
      - name: Fetch official ruling records
        run: python scripts/run-sync.py step rulings -- python scripts/sync-rulings.py --cache .rulings-cache --refresh
      - name: Reject incomplete or unexpectedly reduced imports
        run: python scripts/run-sync.py step guard -- python scripts/sync-guard.py .sync-before.json --before-provenance .sync-before-provenance.json
      - name: Check laws against raw official sources
        run: python scripts/run-sync.py step validate-laws -- python scripts/validate-data.py --cache .law-cache --sync-report artifacts/sync-run/laws-report.json
      - name: Check rulings against raw official sources
        run: python scripts/run-sync.py step validate-rulings -- python scripts/check-rulings.py --cache .rulings-cache
      - run: python scripts/run-sync.py step snapshot -- npm run snapshot
      - run: python scripts/run-sync.py step build -- npm run build
      - run: python scripts/run-sync.py step typecheck -- npm run typecheck
      - run: python scripts/run-sync.py step check -- npm run check
      - name: Save fully verified data and diff for human review
        id: verify
        run: python scripts/run-sync.py verify
      - name: Propose verified data updates
        if: >-
          steps.verify.outputs.publish_data == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: data/weekly-official-snapshot
          title: '資料：官方法規與函釋快照更新'
          commit-message: 'data: refresh verified official snapshots'
          body-path: sync-pr.md
          draft: true
          add-paths: |
            data/catalog.json
            data/sync-report.json
            data/provenance.json
            data/history.json
            data/versions/
            public/data/laws.json
            public/data/catalog.json
            public/data/rulings.json
      - name: Finalize evidence and restore canonical data after a failed run
        if: always() && steps.initialize.outcome == 'success'
        env:
          SYNC_JOB_STATUS: ${{ job.status }}
        run: python scripts/run-sync.py finalize --outcome "$SYNC_JOB_STATUS"
      - name: Preserve this run's diagnostics and verified review artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sync-run/
          if-no-files-found: error
          retention-days: 14
