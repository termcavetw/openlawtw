name: Validate code and legal data
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Install PDF text extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/validate-data.py
      - run: python scripts/import-accessibility-reader.py --check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check reading and printing in browser
        run: python scripts/check-law-print-browser.py artifacts/browser-check
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openlawtw-browser-check
          path: artifacts/browser-check
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openlawtw-review
          path: |
            artifacts/openlawtw-source.zip
            openlawtw.html
          retention-days: 7
