name: Temporary official source connectivity probe
on:
  push:
    branches: ['diagnostics/local-source-connectivity']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read three official pages once with default TLS verification
        run: python scripts/probe-local-connectivity.py
      - name: Retain read-only connectivity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: official-connectivity-${{ matrix.os }}
          path: connectivity-report.json
          retention-days: 7
