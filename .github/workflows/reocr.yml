name: Re-OCR Taoyuan minutes and 土管要點
# One-off, manual: re-read every OCR'd page with scripts/ocr_engine.py (PaddleOCR) in
# parallel shards, then propose the new text as a draft pull request for review.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Parallel OCR jobs
        default: '20'
      mode:
        description: 'text = re-read OCR pages; tables = rebuild 土管 tables with the table model'
        type: choice
        options: [text, tables]
        default: text
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: reocr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        run: python3 -c "import json;n=int('${{ inputs.shards }}');print('shards='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
  ocr:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-chi-tra
      - run: python -m pip install -r requirements.txt -r requirements-ocr.txt
      - run: python scripts/reocr.py ocr --shards ${{ inputs.shards }} --shard ${{ matrix.shard }} --mode ${{ inputs.mode }} --out shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reocr-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          retention-days: 7
  apply:
    needs: ocr
    if: always() && needs.ocr.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: reocr-shard-*
          path: shards
          merge-multiple: true
      - run: python scripts/reocr.py apply shards/*.json --mode ${{ inputs.mode }} --review reocr-pr.md
      - run: python scripts/check-minutes.py && python scripts/check-landuse.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: "${{ inputs.mode == 'tables' && 'data/landuse-tables' || 'data/reocr-paddle' }}"
          title: "${{ inputs.mode == 'tables' && '資料：土管要點表格改用表格辨識模型重建' || '資料：桃園會議紀錄與土管要點改用 PaddleOCR 重新辨識' }}"
          commit-message: "${{ inputs.mode == 'tables' && 'data: rebuild Taoyuan land-use tables with the table model' || 'data: re-OCR scanned Taoyuan minutes and land-use pages with PaddleOCR' }}"
          body-path: reocr-pr.md
          draft: true
          add-paths: |
            public/data/minutes.json
            public/data/landuse.json
